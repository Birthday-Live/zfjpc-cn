<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="响应设备姿态的互动折纸模拟演示。"
    />
    <meta name="theme-color" content="#201a14" />
    <title>kami</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="preload" as="image" href="textures/wood.jpg" />
    <link rel="preload" as="image" href="textures/paper.jpg" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="hud">
      <div class="row">
        <button id="resetActive" type="button">重置</button>
        <button id="undo" type="button" disabled>撤销</button>
        <button id="foldFallback" type="button">折叠</button>
        <button
          id="toggleHelp"
          type="button"
          aria-controls="helpBlock"
          aria-pressed="false"
        >
          显示选项
        </button>
        <a
          id="buyCoffee"
          href="https://www.buymeacoffee.com/maxwase"
          target="_blank"
          style="display: none"
        >
          <img
            src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png"
            alt="请我喝杯咖啡"
            style="height: 32px; width: auto"
          />
        </a>
      </div>

      <div class="help" id="helpBlock" style="display: none">
        <div id="foldHelp"></div>
        <div id="gestureHelp"></div>
        <div class="row" aria-label="动作选项">
          <div class="input-row mono">
            <span>稳定性阈值：</span>
            <span id="stableAccelValue">0.35 m/s²</span>
            <input
              id="stableAccel"
              type="range"
              min="0"
              max="3"
              step="0.05"
              value="0.35"
            />
          </div>
          <div class="input-row mono">
            <label
              title="反转触发折叠时优先移动的方向（哪一侧向哪一侧折叠）"
            >
              反转折叠方向
              <input id="invertFoldDirection" type="checkbox" />
            </label>
          </div>
          <div class="input-row mono" aria-label="铰链控制">
            <span>X 轴：</span>
            <input
              id="manualHingeX"
              type="range"
              min="0"
              max="100"
              step="1"
              value="50"
            />
            <span>Y 轴：</span>
            <input
              id="manualHingeY"
              type="range"
              min="0"
              max="100"
              step="1"
              value="50"
            />
          </div>
          <div class="input-row mono">
            <label>
              翻转铰链
              <input id="manualHingeFlip" type="checkbox" />
            </label>
          </div>
        </div>

        <div class="mono" id="status" role="status" aria-live="polite"></div>

        <div class="input-row mono">
          <a
            id="repoLink"
            href="https://github.com/maxwase/kami"
            target="_blank"
            rel="noreferrer"
          >
            GitHub 源码
          </a>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
